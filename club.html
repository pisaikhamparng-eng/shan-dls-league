<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909">
<title>Club Profile | SHAN DLS LEAGUE</title>
<style>
:root{--bg:#080909;--panel:#111412;--panel2:#171a17;--gold:#d8b45b;--gold2:#f0d68d;--white:#f6f4ee;--muted:#a4a59e;--line:#2a2d29}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.container{width:min(1050px,92%);margin:auto}.top{height:3px;background:linear-gradient(90deg,#8d6b29,var(--gold2),#8d6b29)}header{border-bottom:1px solid var(--line);background:#0b0d0c}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;font-weight:900;letter-spacing:1px}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:2px;margin-top:4px}.back{border:1px solid var(--line);padding:10px 13px;color:var(--gold2);font-size:10px;font-weight:800}.hero{padding:34px 0;background:radial-gradient(ellipse at 80% 30%,rgba(180,139,53,.15),transparent 50%),#101310;border-bottom:1px solid var(--line)}.identity{display:flex;align-items:center;gap:20px}.crest{width:92px;height:92px;border:1px solid #806735;border-radius:50%;display:grid;place-items:center;background:#171a16;overflow:hidden;flex:0 0 92px}.crest img{width:100%;height:100%;object-fit:contain;border-radius:50%}.crest span{font-size:22px;color:var(--gold);font-weight:900}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:900}.hero h1{font-size:clamp(25px,6vw,42px);margin:8px 0}.sub{color:var(--muted);font-size:11px}.container main{padding:25px 0 55px}.section{margin:22px 0}.section h2{font-size:16px;letter-spacing:.5px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:var(--panel);border:1px solid var(--line);padding:13px}.metric b{display:block;color:var(--gold2);font-size:23px}.metric span{font-size:9px;color:var(--muted);letter-spacing:1px}.panel{background:var(--panel);border:1px solid var(--line);overflow:hidden}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:500px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:11px}th{color:var(--gold);font-size:9px;letter-spacing:1px;background:var(--panel2)}td{color:#d4d2c8}.list{display:grid;gap:8px}.match,.player{padding:13px;background:var(--panel);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:10px;line-height:1.6}.score{color:var(--gold2);font-weight:900;white-space:nowrap}.badge{display:inline-block;border:1px solid #69552d;color:var(--gold2);padding:5px 8px;font-size:9px;margin:3px}.empty{padding:20px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed var(--line)}.player-main{display:flex;align-items:center;gap:10px;min-width:0}.avatar{width:36px;height:36px;border-radius:50%;background:#26281f;display:grid;place-items:center;color:var(--gold);font-weight:900;overflow:hidden;flex:0 0 36px}.avatar img{width:100%;height:100%;object-fit:cover}.player-stats{font-size:10px;color:var(--gold2);text-align:right;white-space:nowrap}footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:10px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.identity{gap:13px}.crest{width:72px;height:72px;flex-basis:72px}.match,.player{align-items:flex-start}.player-stats{font-size:9px}}
</style>
</head>
<body><div class="top"></div><header><div class="container nav"><div class="brand">SHAN DLS LEAGUE<small>OFFICIAL CLUB PROFILE</small></div><a class="back" href="index.html#clubs">← ALL CLUBS</a></div></header>
<div id="app"><section class="hero"><div class="container identity"><div class="crest"><span>DLS</span></div><div><div class="eyebrow">OFFICIAL CLUB PROFILE</div><h1>Loading club...</h1><div class="sub">Loading information from SHAN DLS League database</div></div></div></section><main class="container"><div class="empty">Loading club information...</div></main></div>
<footer><div class="container">SHAN DLS LEAGUE · ONE LEAGUE • ONE DREAM • ONE CHAMPION</div></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
(()=>{const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search),id=params.get('id');const names={league:'SHAN DLS LEAGUE',championship:'SHAN DLS CHAMPIONSHIP',cup:'SHAN DLS CUP',champions:'SHAN DLS CHAMPIONS LEAGUE',elite:'SHAN DLS ELITE LEAGUE',supercup:'SHAN DLS SUPER CUP'};let allTeams=[],allMatches=[],allPlayers=[];
const compName=k=>names[k]||k||'Other Competition';const logo=t=>t.logo?'<img src="'+esc(t.logo)+'" alt="'+esc(t.name)+' badge">':'<span>DLS</span>';
function record(list,teamId){const r={MP:0,W:0,D:0,L:0,GF:0,GA:0,PTS:0};list.filter(m=>m.status==='completed'&&(m.homeTeam===teamId||m.awayTeam===teamId)).forEach(m=>{const home=m.homeTeam===teamId,forG=Number(home?m.homeScore:m.awayScore)||0,against=Number(home?m.awayScore:m.homeScore)||0;r.MP++;r.GF+=forG;r.GA+=against;if(forG>against){r.W++;r.PTS+=3}else if(forG<against)r.L++;else{r.D++;r.PTS++}});return r}
function metrics(r){return '<div class="grid">'+[['MP',r.MP],['WON',r.W],['DRAWN',r.D],['LOST',r.L],['GOALS FOR',r.GF],['GOALS AGAINST',r.GA],['GOAL DIFF.',(r.GF-r.GA>0?'+':'')+(r.GF-r.GA)],['POINTS',r.PTS]].map(x=>'<div class="metric"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')+'</div>'}
function matchesHTML(list,t){if(!list.length)return '<div class="empty">No fixtures or results recorded for this club yet.</div>';return '<div class="list">'+list.map(m=>{const home=m.homeTeam===t.id,op=allTeams.find(x=>x.id===(home?m.awayTeam:m.homeTeam));return '<div class="match"><div><b>'+esc(home?m.homeName:m.awayName)+' vs '+esc(op?.name||(home?m.awayName:m.homeName))+'</b><div class="muted">'+esc(compName(m.competition))+' · '+esc(m.round||'')+' · '+esc(m.date||'Date TBA')+'</div></div><div class="score">'+(m.status==='completed'?esc(m.homeScore)+' - '+esc(m.awayScore):'UPCOMING')+'</div></div>'}).join('')+'</div>'}
function render(t){if(!t){$('#app').innerHTML='<main class="container" style="padding:45px 0"><div class="empty">Club not found. Please return to the club directory.</div></main>';return}const my=allMatches.filter(m=>m.homeTeam===t.id||m.awayTeam===t.id);const done=my.filter(m=>m.status==='completed');const league=record(allMatches.filter(m=>m.competition===(t.division||'league')),t.id);const byComp={};my.forEach(m=>(byComp[m.competition]??=[]).push(m));const compRows=Object.entries(byComp).map(([k,arr])=>{const r=record(arr,t.id);const upcoming=arr.filter(m=>m.status!=='completed').length;const latest=arr.slice().sort((a,b)=>String(b.round||'').localeCompare(String(a.round||'')))[0];return '<tr><td><b>'+esc(compName(k))+'</b></td><td>'+arr.length+'</td><td>'+r.MP+'</td><td>'+r.W+'-'+r.D+'-'+r.L+'</td><td>'+(latest?esc(latest.round||'Stage not set'):'Not set')+'</td><td>'+upcoming+'</td></tr>'}).join('');const squad=allPlayers.filter(p=>p.teamId===t.id||p.teamName===t.name);const sorted=done.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));const upcoming=my.filter(m=>m.status!=='completed').sort((a,b)=>(a.date||'').localeCompare(b.date||''));const perfFor=p=>done.flatMap(m=>(m.performances||[]).filter(v=>v.playerId===p.id&&v.teamId===t.id).map(v=>({m,v})));const playerHTML=p=>{const entries=perfFor(p),st={apps:entries.filter(x=>x.v.appeared||x.v.role&&x.v.role!=='none').length,goals:entries.reduce((n,x)=>n+(Number(x.v.goals)||0),0),assists:entries.reduce((n,x)=>n+(Number(x.v.assists)||0),0),cs:entries.reduce((n,x)=>n+(Number(x.v.cleanSheets)||0),0)};return '<div class="player"><div class="player-main"><div class="avatar">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="">':esc((p.name||'?').slice(0,1).toUpperCase()))+'</div><div><b>'+(p.number?'#'+esc(p.number)+' ':'')+esc(p.name)+'</b><div class="muted">'+esc(p.position||'Position not set')+' · '+(p.squadRole==='substitute'?'SUBSTITUTE':'STARTING XI')+'</div></div></div><div class="player-stats">'+st.apps+' APP · '+st.goals+' G · '+st.assists+' A · '+(st.goals+st.assists)+' GI · '+st.cs+' CS</div>'+(entries.length?'<details style="margin-top:9px"><summary class="muted" style="cursor:pointer">MATCH PERFORMANCE HISTORY ('+entries.length+')</summary>'+entries.map(x=>'<div class="muted" style="padding:7px 0;border-top:1px solid #292d27">'+esc(compName(x.m.competition))+' · '+esc(x.m.round||'Match')+' · '+esc(x.m.date||'')+' — '+(Number(x.v.goals)||0)+' G, '+(Number(x.v.assists)||0)+' A, '+((Number(x.v.goals)||0)+(Number(x.v.assists)||0))+' GI, '+(Number(x.v.cleanSheets)||0)+' CS</div>').join('')+'</details>':'')+'</div>'};const starters=squad.filter(p=>p.squadRole!=='substitute'),subs=squad.filter(p=>p.squadRole==='substitute');const playersHTML=squad.length?'<h3 class="eyebrow" style="margin:18px 0 8px">STARTING XI · '+starters.length+'</h3><div class="list">'+(starters.map(playerHTML).join('')||'<div class="empty">No starting players set.</div>')+'</div><h3 class="eyebrow" style="margin:22px 0 8px">SUBSTITUTES · '+subs.length+'</h3><div class="list">'+(subs.map(playerHTML).join('')||'<div class="empty">No substitute players set.</div>')+'</div>':'<div class="empty">No player squad has been added for this club yet.</div>';
const trophy=Array.isArray(t.trophies)&&t.trophies.length?t.trophies.map(x=>'<span class="badge">'+esc(x)+'</span>').join(''):'<div class="empty">Trophy history has not been added yet.</div>';
$('#app').innerHTML='<section class="hero"><div class="container identity"><div class="crest">'+logo(t)+'</div><div><div class="eyebrow">'+esc(t.division==='championship'?'CHAMPIONSHIP':'FIRST DIVISION')+'</div><h1>'+esc(t.name)+'</h1><div class="sub">'+esc(t.shortName||'SHAN DLS LEAGUE CLUB')+'</div></div></div></section><main class="container"><section class="section"><h2>LEAGUE RECORD</h2>'+metrics(league)+'</section><section class="section"><h2>CLUB INFORMATION</h2><div class="panel" style="padding:15px"><div class="grid">'+[['DIVISION',t.division==='championship'?'Championship':'First Division'],['MANAGER / COACH',t.coach||'Not provided'],['HOME GROUND',t.stadium||'Not provided'],['LOCATION',t.location||'Not provided'],['FOUNDED',t.founded||'Not provided'],['SEASON FIXTURES',my.length+' total']].map(x=>'<div><div class="eyebrow">'+x[0]+'</div><div style="font-size:12px;margin-top:6px">'+esc(x[1])+'</div></div>').join('')+'</div>'+(t.description?'<p class="muted" style="margin-top:15px">'+esc(t.description)+'</p>':'')+'</div></section><section class="section"><h2>COMPETITION RECORDS & PROGRESS</h2><div class="panel table-scroll"><table><thead><tr><th>COMPETITION</th><th>FIXTURES</th><th>PLAYED</th><th>W-D-L</th><th>LATEST ROUND</th><th>UPCOMING</th></tr></thead><tbody>'+(compRows||'<tr><td colspan="6">No competition records yet.</td></tr>')+'</tbody></table></div><p class="muted">Stage shown here is based on the latest round entered by the Admin. Official qualification or elimination status must be recorded in the match schedule.</p></section><section class="section"><h2>SQUAD · '+starters.length+' STARTERS / '+subs.length+' SUBSTITUTES</h2>'+playersHTML+'</section><section class="section"><h2>RECENT RESULTS</h2>'+matchesHTML(sorted.slice(0,10),t)+'</section><section class="section"><h2>UPCOMING FIXTURES</h2>'+matchesHTML(upcoming,t)+'</section><section class="section"><h2>TROPHY CABINET</h2>'+trophy+'</section></main>'}
const cfg=window.SHAN_FIREBASE_CONFIG;if(!cfg||!id){$('#app').innerHTML='<main class="container" style="padding:45px 0"><div class="empty">Club information could not be loaded. Please open a club from the official directory.</div></main>';return}try{if(!firebase.apps.length)firebase.initializeApp(cfg);firebase.database().ref('siteData').on('value',s=>{const d=s.val()||{};allTeams=Object.entries(d.teams||{}).map(([id,x])=>({id,...x}));allMatches=Object.entries(d.matches||{}).map(([id,x])=>({id,...x}));allPlayers=Object.entries(d.players||{}).map(([id,p])=>({id,...p}));render(allTeams.find(t=>t.id===id))},e=>{$('#app').innerHTML='<main class="container" style="padding:45px 0"><div class="empty">Database connection error. Please try again later.</div></main>'})}catch(e){console.error(e)}})();
</script></body></html>
