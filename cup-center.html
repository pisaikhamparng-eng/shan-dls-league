<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>SHAN DLS Cup Centre</title>
<style>
:root{--bg:#080909;--panel:#111412;--gold:#d8b45b;--gold2:#f0d68d;--white:#f6f4ee;--muted:#a4a59e;--line:#2a2d29}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px Arial,sans-serif}.wrap{width:min(1100px,94%);margin:auto}header{padding:17px 0;border-bottom:1px solid var(--line);background:#0c0f0d}a{color:var(--gold2);text-decoration:none}.hero{padding:28px 0;background:linear-gradient(120deg,#111712,#19170f);border-bottom:1px solid var(--line)}h1{font-size:clamp(24px,5vw,38px);margin:0 0 8px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#1b211b;border:1px solid var(--line);color:var(--white);padding:10px 13px;border-radius:4px}.tabs button.active{background:#493b20;color:var(--gold2);border-color:var(--gold)}.section{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:15px;margin:14px 0}.section h2{font-size:17px;margin:0 0 12px;color:var(--gold2)}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.group{background:#0b100c;border:1px solid var(--line);padding:11px;border-radius:5px}.group h3{font-size:13px;color:var(--gold);margin:0 0 8px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--gold)}.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.side{display:flex;align-items:center;gap:7px;min-width:0}.side:last-child{justify-content:flex-end;text-align:right}.side img{width:25px;height:25px;object-fit:contain;border-radius:50%}.score{font-weight:bold;color:var(--gold2);white-space:nowrap}.meta{font-size:9px;color:var(--muted);margin-bottom:5px}.stage{margin:14px 0 7px;color:var(--gold);font-size:12px;letter-spacing:1px}.hidden{display:none}@media(max-width:620px){.groups{grid-template-columns:1fr}.match{font-size:11px}.side img{width:21px;height:21px}}
</style></head><body><header><div class="wrap"><b>SHAN DLS LEAGUE · OFFICIAL CUP CENTRE</b><a href="index.html" style="float:right">← MAIN WEBSITE</a></div></header>
<div class="hero"><div class="wrap"><div class="muted">SEASON 2 · CUP COMPETITIONS</div><h1>SHAN DLS CUP · SDCL · SEL</h1><p class="muted">Official draws, groups, fixtures, standings and completed results.</p></div></div>
<main class="wrap"><div class="tabs"><button class="active" data-tab="cup">SHAN DLS CUP</button><button data-tab="sdcl">SDCL</button><button data-tab="sel">SEL</button></div>
<section id="cup" class="section"><h2>SHAN DLS CUP</h2><div id="cupView" class="muted">Loading official draw…</div></section>
<section id="sdcl" class="section hidden"><h2>SHAN DLS CHAMPIONS LEAGUE</h2><div id="sdclView" class="muted">Loading groups…</div></section>
<section id="sel" class="section hidden"><h2>SHAN ELITE LEAGUE</h2><div id="selView" class="muted">Loading groups…</div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
(()=>{const $=id=>document.getElementById(id),cfg=window.SHAN_FIREBASE_CONFIG;let data={};const vals=o=>Object.entries(o||{}).map(([id,v])=>({id,...v}));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const team=id=>data.teams?.[id]||{};const logo=id=>team(id).logo?'<img src="'+esc(team(id).logo)+'" alt="">':'';
function groupTable(kind,g){const ids=data.cupSystem?.season2?.[kind]?.groups?.[g]||[];const rows=ids.map(id=>({...team(id),id,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));const map=Object.fromEntries(rows.map(t=>[t.id,t]));vals(data.matches).filter(m=>m.cupSystemId===kind&&m.stage==='Group Stage'&&m.group===g&&m.status==='completed').forEach(m=>{const h=map[m.homeTeam],a=map[m.awayTeam];if(!h||!a)return;const hs=Number(m.homeScore)||0,as=Number(m.awayScore)||0;h.mp++;a.mp++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;if(hs>as){h.w++;h.pts+=3;a.l++}else if(as>hs){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}});return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name))}
function table(kind,g){const rows=groupTable(kind,g);return '<div class="scroll"><table><thead><tr><th>#</th><th>Club</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>'+rows.map((t,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(t.name)+'</td><td>'+t.mp+'</td><td>'+t.w+'</td><td>'+t.d+'</td><td>'+t.l+'</td><td>'+t.gf+'</td><td>'+t.ga+'</td><td>'+(t.gf-t.ga)+'</td><td><b>'+t.pts+'</b></td></tr>').join('')+'</tbody></table></div>'}
function matchCard(m){const state=m.status==='completed'?'FULL TIME':m.status==='live'?'LIVE':'UPCOMING';return '<div class="item"><div class="meta">'+esc(m.stage||m.round||'')+(m.group?' · GROUP '+esc(m.group):'')+(m.leg?' · LEG '+m.leg:'')+' · '+state+'</div><div class="match"><span class="side">'+logo(m.homeTeam)+'<b>'+esc(m.homeName)+'</b></span><span class="score">'+(m.status==='completed'||m.status==='live'?m.homeScore+' – '+m.awayScore:'VS')+'</span><span class="side">'+logo(m.awayTeam)+'<b>'+esc(m.awayName)+'</b></span></div></div>'}
function render(){const cup=vals(data.matches).filter(m=>m.cupSystemId==='cup').sort((a,b)=>(a.cupRound||0)-(b.cupRound||0)||(a.matchNumber||0)-(b.matchNumber||0));const cupConf=data.cupSystem?.season2?.cup?.preliminary;const byeText=cupConf?'<div class="muted">First Division Bye (20): '+vals(data.teams).filter(t=>(t.division||'league')==='league').map(t=>esc(t.name)).join(' · ')+'<br>Championship Random Bye (4): '+(cupConf.bye||[]).map(id=>esc(team(id).name)).join(' · ')+'</div>':'';$('cupView').innerHTML=(cup.length?byeText+['Preliminary Round','Round of 32','Round of 16','Quarter-Final','Semi-Final','Final'].map(st=>{const ms=cup.filter(m=>m.stage===st);return ms.length?'<div class="stage">'+st.toUpperCase()+'</div>'+ms.map(matchCard).join(''):''}).join(''):'The official Cup draw has not been published yet.');
['sdcl','sel'].forEach(kind=>{const conf=data.cupSystem?.season2?.[kind];if(!conf?.groups){$(kind+'View').textContent='Official group draw has not been published yet.';return}const groups=['A','B','C','D'];const ms=vals(data.matches).filter(m=>m.cupSystemId===kind);const stages=['Group Stage','Quarter-Final','Semi-Final','Final'];$(kind+'View').innerHTML='<div class="groups">'+groups.map(g=>'<div class="group"><h3>GROUP '+g+'</h3>'+table(kind,g)+'</div>').join('')+'</div>'+stages.map(st=>{const arr=ms.filter(m=>m.stage===st);return arr.length?'<div class="stage">'+st.toUpperCase()+'</div>'+arr.map(matchCard).join(''):''}).join('')})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['cup','sdcl','sel'].forEach(k=>$(k).classList.toggle('hidden',k!==b.dataset.tab))});
if(!firebase.apps.length)firebase.initializeApp(cfg);firebase.database().ref('siteData').on('value',snap=>{data=snap.val()||{};render()},e=>{$('cupView').textContent='Could not load competition data: '+e.message});
})();
</script></body></html>
