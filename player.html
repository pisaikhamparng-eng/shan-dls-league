<style>
:root{--bg:#090a09;--panel:#141714;--gold:#e0bd68;--muted:#a6a99e;--line:#30362e;--white:#f5f2e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px Arial,sans-serif}.wrap{width:min(900px,92%);margin:auto}header{padding:18px 0;border-bottom:1px solid var(--line)}a{color:var(--gold)}.hero{padding:35px 0;background:#111511}.identity{display:flex;gap:20px;align-items:center}.photo{width:112px;height:112px;border-radius:50%;background:#252a23;border:2px solid var(--gold);display:grid;place-items:center;overflow:hidden;font-size:30px;color:var(--gold)}.photo img{width:100%;height:100%;object-fit:cover}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:2px}.name{font-size:clamp(26px,6vw,42px);margin:7px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.card{background:var(--panel);border:1px solid var(--line);padding:15px}.card b{display:block;color:#f5dda0;font-size:24px}.card span{font-size:10px;color:var(--muted)}section{margin:22px 0}h2{font-size:16px}footer{padding:24px 0;color:var(--muted);border-top:1px solid var(--line);font-size:10px}@media(max-width:560px){.photo{width:82px;height:82px;flex-basis:82px}.identity{gap:13px}.grid{grid-template-columns:repeat(2,1fr)}}

<script>
(()=>{const id=new URLSearchParams(location.search).get('id'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cfg=window.SHAN_FIREBASE_CONFIG;if(!id||!cfg){$('#details').innerHTML='<p class="muted">Player profile unavailable.</p>';return}if(!firebase.apps.length)firebase.initializeApp(cfg);firebase.database().ref('siteData').on('value',snap=>{const d=snap.val()||{},p=d.players?.[id];if(!p){$('#details').innerHTML='<p class="muted">Player not found.</p>';return}const team=d.teams?.[p.teamId],matches=Object.values(d.matches||{}).filter(m=>m.status==='completed'),perf=matches.flatMap(m=>(m.performances||[]).filter(v=>v.playerId===id).map(v=>({m,v})));const stat={apps:perf.filter(x=>x.v.appeared||x.v.role&&x.v.role!=='none').length,goals:perf.reduce((n,x)=>n+(Number(x.v.goals)||0),0),assists:perf.reduce((n,x)=>n+(Number(x.v.assists)||0),0),cs:perf.reduce((n,x)=>n+(Number(x.v.cleanSheets)||0),0)};const name=esc(p.name||'Player');$('#profile').innerHTML='<div class="photo">'+(p.photo?'<img src="'+esc(p.photo)+'" alt="'+name+'">':name.slice(0,1).toUpperCase())+'</div><div><div class="eyebrow">OFFICIAL PLAYER PROFILE</div><h1 class="name">'+(p.number?'#'+esc(p.number)+' ':'')+name+'</h1><div class="muted">'+esc(team?.name||p.teamName||'Club not set')+' · '+esc(p.position||'Position not set')+'</div></div>';$('#details').innerHTML='<div class="grid">'+[['RATING',p.rating||'—'],['PLAYER VALUE',Number(p.playerValue||0).toLocaleString()],['TYPE',String(p.playerType||'normal').toUpperCase()],['APPEARANCES',stat.apps],['GOALS',stat.goals],['ASSISTS',stat.assists],['GOAL INVOLVEMENTS',stat.goals+stat.assists],['CLEAN SHEETS',stat.cs],['SQUAD ROLE',p.squadRole==='substitute'?'SUBSTITUTE':'STARTING XI']].map(x=>'<div class="card"><b>'+esc(x[1])+'</b><span>'+x[0]+'</span></div>').join('')+'</div><section><h2>SEASON PERFORMANCE HISTORY</h2>'+(perf.length?perf.map(x=>'<div class="card" style="margin:8px 0"><b style="font-size:14px">'+esc(x.m.homeName)+' '+esc(x.m.homeScore)+' – '+esc(x.m.awayScore)+' '+esc(x.m.awayName)+'</b><span>'+esc(x.m.competition)+' · '+esc(x.m.round||'')+' · '+esc(x.m.date||'')+'</span><p class="muted">'+(Number(x.v.goals)||0)+' Goals · '+(Number(x.v.assists)||0)+' Assists · '+(Number(x.v.cleanSheets)||0)+' Clean Sheets</p></div>').join(''):'<p class="muted">No match performance has been recorded yet.</p>')+'</section><p><a href="club.html?id='+encodeURIComponent(p.teamId||'')+'">← BACK TO CLUB PROFILE</a></p>'},e=>{$('#details').textContent='Database connection error: '+e.message})})();
